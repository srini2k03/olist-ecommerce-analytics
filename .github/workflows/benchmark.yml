name: Benchmark

# Times ingestion, data-quality checks, transformations, every analytics query (DuckDB and
# Postgres), the metric layer and the dashboard computations on a standard runner, including
# the two Postgres slow paths fixed in 492a77f, and commits results/benchmarks/benchmark_ci.json.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: olist
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OLIST_PG_DSN: postgresql://postgres:postgres@localhost:5432/olist
      BENCH_MACHINE: "GitHub Actions ubuntu-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt -e .
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: olist-raw-${{ hashFiles('scripts/fetch_data.py') }}
      - run: python scripts/fetch_data.py
      - name: Benchmark (DuckDB, dashboard computations, Postgres incl. the fixed slow paths)
        run: >-
          python scripts/benchmark.py --postgres --postgres-regressions
          --out results/benchmarks/benchmark_ci.json
      - name: Commit the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/benchmarks/benchmark_ci.json
          git commit -m "Benchmark on GitHub Actions (${GITHUB_SHA::7}, run ${GITHUB_RUN_ID})"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push the benchmark result"; exit 1
