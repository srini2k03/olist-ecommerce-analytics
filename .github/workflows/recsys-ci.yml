name: Recsys CI

# Lint and test the H&M recommender (src/recsys) on synthetic data only: no
# network, no Kaggle credentials. Real-data runs happen locally (make recsys-data).
on:
  push:
    paths:
      - "src/recsys/**"
      - "tests/recsys/**"
      - "requirements-recsys.txt"
      - ".github/workflows/recsys-ci.yml"
  pull_request:
    paths:
      - "src/recsys/**"
      - "tests/recsys/**"
      - "requirements-recsys.txt"
      - ".github/workflows/recsys-ci.yml"
  workflow_dispatch:

concurrency:
  group: recsys-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Ruff + pytest tests/recsys + synthetic pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt -r requirements-recsys.txt -e .
      - run: ruff check src/recsys tests/recsys
      - run: ruff format --check src/recsys tests/recsys
      - run: pytest -v tests/recsys
      - name: End-to-end synthetic run (python -m recsys --synthetic)
        run: python -m recsys --synthetic --data-dir "$RUNNER_TEMP/hm" --n-boot 200
