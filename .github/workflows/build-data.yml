name: Build data

# Fetches the real Olist data, rebuilds every derived artefact and commits the
# result: SQL snapshots, executed notebooks, metrics, figures and the small
# app/data bundle the Streamlit app reads.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "sql/**"
      - "scripts/**"
      - "requirements*.txt"

permissions:
  contents: write

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt -e .
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: olist-raw-${{ hashFiles('scripts/fetch_data.py') }}
      - name: Fetch real data (Kaggle if secrets are set, else the pinned mirror)
        run: python scripts/fetch_data.py
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      - run: python scripts/build_warehouse.py
      - run: python scripts/run_sql.py
      - run: make notebooks
      - run: python scripts/build_app_data.py
      - name: Refresh app screenshots for the README
        run: |
          python -m playwright install --with-deps chromium
          python scripts/smoke_app.py --screenshot results/figures/app_overview.png
          mv results/figures/app_overview_churn.png results/figures/app_churn.png
      - name: Commit changed artefacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results notebooks app/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Rebuild data artefacts from the real Olist dataset (${GITHUB_SHA::7})"
            git push
          fi
