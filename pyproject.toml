[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-analytics"
version = "0.1.0"
description = "SQL, statistics, segmentation and churn modelling on the Olist Brazilian e-commerce dataset"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Srinivasan Balasubramanian" }]
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "NPY"]
ignore = ["S101", "S608"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501", "B018"]
"tests/*" = ["S"]

[tool.ruff.lint.isort]
known-first-party = ["olist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["postgres: needs OLIST_PG_DSN", "realdata: needs data/olist.duckdb built from the real CSVs"]
